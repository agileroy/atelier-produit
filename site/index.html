<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atelier Produit</title>
  <meta name="description" content="Atelier guidé pour découvrir le Design Thinking, l'empathy map, l'impact mapping et le story mapping sur un même cas fil rouge.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <script>
    // Thème appliqué avant l'affichage : choix mémorisé (partagé avec la boîte à outils), sinon réglage du système.
    try { var th = localStorage.getItem('theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600&display=swap">
  <link rel="stylesheet" href="app.css?v=__VERSION__">
  <script src="vendor/qrcode-generator-1.4.4.js?v=__VERSION__" defer></script>
  <script type="module" src="js/app.js?v=__VERSION__"></script>
</head>
<body>
  <script>
    // Un code de salle (?code=) ou une séance (?atelier=) dans l'adresse : on ouvre l'atelier en mode participant.
    if (/[?&](code|atelier)=/.test(location.search)) { document.body.dataset.mode = 'participant'; document.title = 'Atelier Produit · Participant'; }
  </script>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="topbar">
    <a class="brand" href="./">
      <svg class="brand-mark" viewBox="0 0 40 32" aria-hidden="true">
        <rect x="2" y="9" width="15" height="15" rx="2" transform="rotate(-8 9.5 16.5)" fill="#3D9DB3"/>
        <rect x="12.5" y="4" width="15" height="15" rx="2" fill="#E0B12B"/>
        <rect x="23" y="10" width="15" height="15" rx="2" transform="rotate(9 30.5 17.5)" fill="#E0782B"/>
      </svg>
      <span>Atelier Produit</span>
    </a>
    <ol class="stepper" id="stepper"></ol>
    <div class="tools">
      <span class="me-badge" id="me-badge" hidden></span>
      <button type="button" class="phones-btn" id="phones-btn" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg>
        <span class="phones-label">Participants</span>
        <span class="phones-count" id="phones-count" hidden></span>
      </button>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Passer en thème sombre">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap" id="main"></main>

  <footer class="wrap footer">
    <p>Cas, personas et extraits d'interview fictifs. Aucune donnée ne quitte le navigateur, sauf les post-its et les réponses envoyés par les participants.</p>
    <p><a href="https://agileroy.github.io/outils/">Boîte à outils</a></p>
  </footer>

  <dialog class="dialog" id="editor" aria-labelledby="editor-title"></dialog>
  <dialog class="dialog dialog--phones" id="phones" aria-labelledby="phones-title"></dialog>
  <dialog class="dialog dialog--join" id="join" aria-labelledby="join-title"></dialog>

  <section class="print-report" id="print-report" aria-hidden="true"></section>
  <input type="file" id="file-input" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
  <script data-goatcounter="https://vincentleroy.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>

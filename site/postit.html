<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Envoyer un post-it · Atelier Produit</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <script>
    try { var th = localStorage.getItem('theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600&display=swap">
  <link rel="stylesheet" href="app.css?v=__VERSION__">
  <script type="module" src="js/postit.js?v=__VERSION__"></script>
</head>
<body class="page-postit">
  <header class="topbar topbar--simple">
    <a class="brand" href="./">
      <svg class="brand-mark" viewBox="0 0 40 32" aria-hidden="true">
        <rect x="2" y="9" width="15" height="15" rx="2" transform="rotate(-8 9.5 16.5)" fill="#3D9DB3"/>
        <rect x="12.5" y="4" width="15" height="15" rx="2" fill="#E0B12B"/>
        <rect x="23" y="10" width="15" height="15" rx="2" transform="rotate(9 30.5 17.5)" fill="#E0782B"/>
      </svg>
      <span>Atelier Produit</span>
    </a>
    <div class="tools">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Passer en thème sombre">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main class="wrap postit-main" id="main">
    <p class="hint">Connexion…</p>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
</body>
</html>
